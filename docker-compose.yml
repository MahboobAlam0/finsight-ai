version: '3.8'

services:
  api:
    build: .
    container_name: alphasignal-api
    command: uvicorn src.api.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY} # Pass API key if set in host env

  frontend:
    build: .
    container_name: alphasignal-frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000 # Internal Docker network address
